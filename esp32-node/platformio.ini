[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:esp32dev]
build_src_filter = +<*> -<wifi_test.cpp> -<mqtt_test.cpp>

[env:wifi_test]
build_src_filter = +<*> -<main.cpp> -<mqtt_test.cpp>

[env:mqtt_test]
build_src_filter = +<*> -<main.cpp> -<wifi_test.cpp>
lib_deps = knolleary/PubSubClient@2.8